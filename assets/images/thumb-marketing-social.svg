<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="mbg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="60%" stop-color="#1e1b26"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#mbg2)"/>
  
  <rect x="60" y="50" width="220" height="36" rx="18" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="170" y="73" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">INSTAGRAM &amp; FACEBOOK</text>

  <!-- Social Growth visualization -->
  <g transform="translate(100, 130)">
    <rect x="0" y="0" width="480" height="440" rx="14" fill="#18181c" stroke="#3f3f46" stroke-width="1"/>
    <text x="40" y="50" fill="#a1a1aa" font-family="sans-serif" font-size="14" font-weight="600">AUDIENCE REACH &amp; IMPRESSIONS</text>
    <text x="40" y="110" fill="#ffffff" font-family="sans-serif" font-size="46" font-weight="700">1.2M+</text>
    <text x="40" y="145" fill="#a1a1aa" font-family="sans-serif" font-size="14">Total Organic &amp; Paid Reach</text>
    
    <!-- Mini bar chart -->
    <rect x="40" y="220" width="40" height="170" rx="4" fill="#27272a"/>
    <rect x="100" y="190" width="40" height="200" rx="4" fill="#3f3f46"/>
    <rect x="160" y="150" width="40" height="240" rx="4" fill="#52525b"/>
    <rect x="220" y="120" width="40" height="270" rx="4" fill="#71717a"/>
    <rect x="280" y="80" width="40" height="310" rx="4" fill="#a1a1aa"/>
    <rect x="340" y="40" width="40" height="350" rx="4" fill="#ffffff"/>

    <!-- Right card: Engagement breakdown -->
    <rect x="520" y="0" width="480" height="440" rx="14" fill="#18181c" stroke="#3f3f46" stroke-width="1"/>
    <text x="560" y="50" fill="#a1a1aa" font-family="sans-serif" font-size="14" font-weight="600">ENGAGEMENT SPIKE</text>
    <text x="560" y="110" fill="#ffffff" font-family="sans-serif" font-size="46" font-weight="700">+280%</text>

    <!-- Social interaction pills -->
    <rect x="560" y="170" width="400" height="60" rx="10" fill="#131316" stroke="#27272a" stroke-width="1"/>
    <text x="580" y="206" fill="#f4f4f5" font-family="sans-serif" font-size="15" font-weight="600">Saves &amp; Shares</text>
    <text x="920" y="206" fill="#a1a1aa" font-family="sans-serif" font-size="15" text-anchor="end">42,500+</text>

    <rect x="560" y="250" width="400" height="60" rx="10" fill="#131316" stroke="#27272a" stroke-width="1"/>
    <text x="580" y="286" fill="#f4f4f5" font-family="sans-serif" font-size="15" font-weight="600">Profile Visits</text>
    <text x="920" y="286" fill="#a1a1aa" font-family="sans-serif" font-size="15" text-anchor="end">89,200+</text>

    <rect x="560" y="330" width="400" height="60" rx="10" fill="#131316" stroke="#27272a" stroke-width="1"/>
    <text x="580" y="366" fill="#f4f4f5" font-family="sans-serif" font-size="15" font-weight="600">Follower Growth</text>
    <text x="920" y="366" fill="#a1a1aa" font-family="sans-serif" font-size="15" text-anchor="end">+18,400</text>
  </g>

  <text x="600" y="620" fill="#a1a1aa" font-family="sans-serif" font-size="16" text-anchor="middle">Omni-Channel Campaign Strategy &bull; Content Pillars &bull; Viral Hooks</text>
</svg>
