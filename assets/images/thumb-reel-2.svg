<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="100%" height="100%">
  <defs>
    <linearGradient id="reelGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="40%" stop-color="#0c1729"/>
      <stop offset="80%" stop-color="#091420"/>
      <stop offset="100%" stop-color="#0f263e"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1280" fill="url(#reelGrad2)"/>

  <!-- Camera Viewfinder Corners -->
  <path d="M 50 110 L 50 60 L 100 60" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  <path d="M 670 110 L 670 60 L 620 60" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50 1170 L 50 1220 L 100 1220" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  <path d="M 670 1170 L 670 1220 L 620 1220" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Badges -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="95" height="36" rx="18" fill="#ef4444" opacity="0.95"/>
    <circle cx="20" cy="18" r="6" fill="#ffffff"/>
    <text x="35" y="23" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">REC</text>

    <rect x="110" y="0" width="145" height="36" rx="18" fill="#082f49" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="182" y="23" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">HDR &bull; 60 FPS</text>
  </g>

  <rect x="540" y="80" width="115" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="597" y="103" fill="#bae6fd" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">00:45:08</text>

  <!-- Product Aesthetic Grid & Glow -->
  <g transform="translate(160, 360)">
    <rect x="0" y="0" width="400" height="300" rx="20" fill="#0c1a2e" stroke="#0284c7" stroke-width="2"/>
    <circle cx="200" cy="150" r="90" fill="#0369a1" opacity="0.4"/>
    <circle cx="200" cy="150" r="40" fill="#38bdf8" opacity="0.7"/>
    <line x1="40" y1="240" x2="360" y2="240" stroke="#0284c7" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="200" y="275" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">PRODUCT TEASER CUT</text>
  </g>

  <!-- Vibrant Play Button -->
  <g transform="translate(360, 740)">
    <circle cx="0" cy="0" r="72" fill="#082f49" stroke="url(#neonCyan)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="58" fill="url(#neonCyan)" opacity="0.9"/>
    <polygon points="-12,-24 24,0 -12,24" fill="#ffffff"/>
  </g>

  <!-- Info Text -->
  <g transform="translate(360, 960)">
    <rect x="-195" y="-35" width="390" height="50" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" opacity="0.95"/>
    <text x="0" y="0" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800" text-anchor="middle">PRODUCT LAUNCH REEL</text>
    <text x="0" y="45" fill="#bae6fd" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">COLOR GRADED &bull; SMOOTH CUTS</text>
  </g>
</svg>
