<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="100%" height="100%">
  <defs>
    <linearGradient id="reelGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="45%" stop-color="#1c1106"/>
      <stop offset="100%" stop-color="#2d1204"/>
    </linearGradient>
    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1280" fill="url(#reelGrad3)"/>

  <!-- Camera Viewfinder Corners -->
  <path d="M 50 110 L 50 60 L 100 60" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 670 110 L 670 60 L 620 60" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50 1170 L 50 1220 L 100 1220" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 670 1170 L 670 1220 L 620 1220" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Status Badges -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="95" height="36" rx="18" fill="#ef4444" opacity="0.95"/>
    <circle cx="20" cy="18" r="6" fill="#ffffff"/>
    <text x="35" y="23" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">REC</text>

    <rect x="110" y="0" width="130" height="36" rx="18" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="175" y="23" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4K &bull; 60 FPS</text>
  </g>

  <rect x="540" y="80" width="115" height="36" rx="18" fill="#1c1917" stroke="#44403c" stroke-width="1.5"/>
  <text x="597" y="103" fill="#fef08a" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">00:58:24</text>

  <!-- Talking Head Frame Graphic with Captions -->
  <g transform="translate(160, 360)">
    <circle cx="200" cy="110" r="75" fill="#292524" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 90 260 C 90 180, 310 180, 310 260" fill="#292524" stroke="#f59e0b" stroke-width="2"/>
    <!-- Animated Subtitle Pill -->
    <rect x="30" y="270" width="340" height="42" rx="10" fill="#f59e0b"/>
    <text x="200" y="297" fill="#000000" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">[ENGAGING CAPTIONS ON HOOK]</text>
  </g>

  <!-- Play Button -->
  <g transform="translate(360, 750)">
    <circle cx="0" cy="0" r="72" fill="#292524" stroke="url(#neonAmber)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="58" fill="url(#neonAmber)" opacity="0.95"/>
    <polygon points="-12,-24 24,0 -12,24" fill="#000000"/>
  </g>

  <!-- Info Text -->
  <g transform="translate(360, 960)">
    <rect x="-195" y="-35" width="390" height="50" rx="10" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5" opacity="0.95"/>
    <text x="0" y="0" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800" text-anchor="middle">EDUCATIONAL REEL</text>
    <text x="0" y="45" fill="#fef08a" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">ANIMATED CAPTIONS &bull; B-ROLL CUTS</text>
  </g>
</svg>
