<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="100%" height="100%">
  <defs>
    <linearGradient id="reelGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="40%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1280" fill="url(#reelGrad4)"/>

  <!-- Camera Viewfinder Corners -->
  <path d="M 50 110 L 50 60 L 100 60" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <path d="M 670 110 L 670 60 L 620 60" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50 1170 L 50 1220 L 100 1220" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <path d="M 670 1170 L 670 1220 L 620 1220" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Badges -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="95" height="36" rx="18" fill="#ef4444" opacity="0.95"/>
    <circle cx="20" cy="18" r="6" fill="#ffffff"/>
    <text x="35" y="23" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">REC</text>

    <rect x="110" y="0" width="130" height="36" rx="18" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
    <text x="175" y="23" fill="#6ee7b7" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4K &bull; 60 FPS</text>
  </g>

  <rect x="540" y="80" width="115" height="36" rx="18" fill="#064e3b" stroke="#047857" stroke-width="1.5"/>
  <text x="597" y="103" fill="#a7f3d0" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">00:35:18</text>

  <!-- Lifestyle Frame -->
  <g transform="translate(160, 360)">
    <rect x="0" y="0" width="400" height="300" rx="18" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <circle cx="150" cy="120" r="45" fill="#34d399" opacity="0.5"/>
    <polygon points="50,280 200,160 350,280" fill="#047857"/>
    <polygon points="180,280 270,200 380,280" fill="#10b981" opacity="0.7"/>
  </g>

  <!-- Play Button -->
  <g transform="translate(360, 740)">
    <circle cx="0" cy="0" r="72" fill="#022c22" stroke="url(#neonEmerald)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="58" fill="url(#neonEmerald)" opacity="0.95"/>
    <polygon points="-12,-24 24,0 -12,24" fill="#000000"/>
  </g>

  <!-- Info Text -->
  <g transform="translate(360, 960)">
    <rect x="-195" y="-35" width="390" height="50" rx="10" fill="#022c22" stroke="#10b981" stroke-width="1.5" opacity="0.95"/>
    <text x="0" y="0" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800" text-anchor="middle">LIFESTYLE &amp; TRAVEL REEL</text>
    <text x="0" y="45" fill="#a7f3d0" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">CINEMATIC GRADE &bull; MATCH CUTS</text>
  </g>
</svg>
