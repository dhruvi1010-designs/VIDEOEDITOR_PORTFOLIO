<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="100%" height="100%">
  <defs>
    <linearGradient id="reelGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="35%" stop-color="#0f0c20"/>
      <stop offset="70%" stop-color="#130924"/>
      <stop offset="100%" stop-color="#2a0845"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="720" height="1280" fill="url(#reelGrad1)"/>
  <circle cx="360" cy="640" r="380" fill="url(#glow1)"/>

  <!-- Camera Viewfinder Crosshairs & Corners -->
  <path d="M 50 110 L 50 60 L 100 60" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
  <path d="M 670 110 L 670 60 L 620 60" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50 1170 L 50 1220 L 100 1220" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
  <path d="M 670 1170 L 670 1220 L 620 1220" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Status Badges -->
  <g transform="translate(60, 80)">
    <!-- REC Badge -->
    <rect x="0" y="0" width="95" height="36" rx="18" fill="#ef4444" opacity="0.95"/>
    <circle cx="20" cy="18" r="6" fill="#ffffff"/>
    <text x="35" y="23" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="1">REC</text>

    <!-- 4K 60FPS Badge -->
    <rect x="110" y="0" width="130" height="36" rx="18" fill="#18181b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="175" y="23" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">4K &bull; 60 FPS</text>
  </g>

  <!-- Duration Badge -->
  <rect x="540" y="80" width="115" height="36" rx="18" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="597" y="103" fill="#e4e4e7" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">00:30:12</text>

  <!-- Dynamic Vibrant Soundwave Bars -->
  <g transform="translate(140, 420)">
    <rect x="0" y="70" width="10" height="60" rx="5" fill="#a855f7"/>
    <rect x="22" y="30" width="10" height="140" rx="5" fill="#c084fc"/>
    <rect x="44" y="60" width="10" height="80" rx="5" fill="#818cf8"/>
    <rect x="66" y="10" width="10" height="180" rx="5" fill="#38bdf8"/>
    <rect x="88" y="40" width="10" height="120" rx="5" fill="#a855f7"/>
    <rect x="110" y="20" width="10" height="160" rx="5" fill="#ec4899"/>
    <rect x="132" y="80" width="10" height="40" rx="5" fill="#f43f5e"/>
    <rect x="154" y="15" width="10" height="170" rx="5" fill="#38bdf8"/>
    <rect x="176" y="45" width="10" height="110" rx="5" fill="#c084fc"/>
    <rect x="198" y="5" width="10" height="190" rx="5" fill="#a855f7"/>
    <rect x="220" y="50" width="10" height="100" rx="5" fill="#818cf8"/>
    <rect x="242" y="25" width="10" height="150" rx="5" fill="#ec4899"/>
    <rect x="264" y="65" width="10" height="70" rx="5" fill="#f43f5e"/>
    <rect x="286" y="10" width="10" height="180" rx="5" fill="#38bdf8"/>
    <rect x="308" y="35" width="10" height="130" rx="5" fill="#c084fc"/>
    <rect x="330" y="60" width="10" height="80" rx="5" fill="#a855f7"/>
    <rect x="352" y="15" width="10" height="170" rx="5" fill="#ec4899"/>
    <rect x="374" y="50" width="10" height="100" rx="5" fill="#818cf8"/>
    <rect x="396" y="30" width="10" height="140" rx="5" fill="#38bdf8"/>
    <rect x="418" y="70" width="10" height="60" rx="5" fill="#a855f7"/>
  </g>

  <!-- Vibrant Play Button with Neon Glow -->
  <g transform="translate(360, 720)">
    <circle cx="0" cy="0" r="72" fill="#0f0c20" stroke="url(#neonPurple)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="58" fill="url(#neonPurple)" opacity="0.9"/>
    <polygon points="-12,-24 24,0 -12,24" fill="#ffffff"/>
  </g>

  <!-- Kinetic Typography Overlay -->
  <g transform="translate(360, 960)">
    <rect x="-190" y="-35" width="380" height="50" rx="10" fill="#18181b" stroke="#a855f7" stroke-width="1.5" opacity="0.95"/>
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="1">VIRAL BRAND REEL</text>
    <text x="0" y="45" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="18" font-weight="600" text-anchor="middle">SPEED RAMPS &bull; DYNAMIC SFX &bull; 9:16</text>
  </g>
</svg>
