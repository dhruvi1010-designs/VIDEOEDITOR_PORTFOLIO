      <rect x="0" y="75" width="380" height="28" rx="6" fill="url(#igGradient)"/>
      <text x="395" y="94" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800">82.5% (373K)</text>

      <!-- Carousels Bar -->
