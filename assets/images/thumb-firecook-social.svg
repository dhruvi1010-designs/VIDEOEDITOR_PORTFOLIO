    <!-- Right: Top Performing Posts Grid -->
    <g transform="translate(540, 25)">
      <text x="0" y="20" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800">Top Performing Culinary Posts</text>

      <!-- Post 1 -->
      <rect x="0" y="45" width="500" height="75" rx="10" fill="#200d24" stroke="#4a1554" stroke-width="1"/>
      <rect x="15" y="55" width="45" height="55" rx="6" fill="#4a1554"/>
      <text x="37" y="88" fill="#ffffff" font-family="sans-serif" font-size="18" text-anchor="middle">&#127859;</text>
      <text x="75" y="75" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Crispy Chakri Bhajiya Reel</text>
      <text x="75" y="95" fill="#9ca3af" font-family="sans-serif" font-size="12">148K Views &bull; 14.2K Saves &bull; 850+ Inquiries</text>
      <rect x="410" y="65" width="75" height="26" rx="13" fill="#10b981"/>
      <text x="447" y="82" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">VIRAL</text>

      <!-- Post 2 -->
      <rect x="0" y="130" width="500" height="75" rx="10" fill="#200d24" stroke="#4a1554" stroke-width="1"/>
      <rect x="15" y="140" width="45" height="55" rx="6" fill="#4a1554"/>
      <text x="37" y="173" fill="#ffffff" font-family="sans-serif" font-size="18" text-anchor="middle">&#129367;</text>
      <text x="75" y="160" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Dhosa Tava Seasoning Masterclass</text>
      <text x="75" y="180" fill="#9ca3af" font-family="sans-serif" font-size="12">112K Views &bull; 9.8K Saves &bull; 520+ Inquiries</text>
      <rect x="410" y="150" width="75" height="26" rx="13" fill="#10b981"/>
      <text x="447" y="167" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">VIRAL</text>

      <!-- Post 3 -->
      <rect x="0" y="215" width="500" height="75" rx="10" fill="#200d24" stroke="#4a1554" stroke-width="1"/>
      <rect x="15" y="225" width="45" height="55" rx="6" fill="#4a1554"/>
      <text x="37" y="258" fill="#ffffff" font-family="sans-serif" font-size="18" text-anchor="middle">&#127856;</text>
      <text x="75" y="245" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Baking Workshop Batch Announcement</text>
      <text x="75" y="265" fill="#9ca3af" font-family="sans-serif" font-size="12">Carousel &bull; 85 Seats Filled in 48 Hours</text>
      <rect x="410" y="235" width="75" height="26" rx="13" fill="#f59e0b"/>
      <text x="447" y="252" fill="#000000" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">HOUSEFULL</text>
    </g>
  </g>
</svg>

