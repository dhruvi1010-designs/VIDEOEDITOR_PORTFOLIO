      <rect x="0" y="140" width="460" height="28" rx="6" fill="#250d29"/>
      <rect x="0" y="140" width="240" height="28" rx="6" fill="#f58529"/>
      <text x="255" y="159" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800">12.5% (56K)</text>

      <!-- Stories Bar -->
      <text x="0" y="195" fill="#e5e7eb" font-family="sans-serif" font-size="13" font-weight="600">Daily Class Stories &amp; Student Q&amp;A</text>
      <rect x="0" y="205" width="460" height="28" rx="6" fill="#250d29"/>
      <rect x="0" y="205" width="120" height="28" rx="6" fill="#8134af"/>
      <text x="135" y="224" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800">5.0% (23K)</text>

      <!-- Growth Summary -->
      <rect x="0" y="250" width="460" height="48" rx="8" fill="#200d24" stroke="#4a1554" stroke-width="1"/>
      <text x="20" y="280" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="700">&#10004; Managed by Dhruvi: 100% On-Time Scheduled Execution</text>
